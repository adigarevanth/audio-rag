version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: audio-rag-db
    environment:
      POSTGRES_DB: audio_rag
      POSTGRES_USER: audio_rag
      POSTGRES_PASSWORD: audio_rag_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql

volumes:
  pgdata:
